<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>AI World Viewer v23 (Stable)</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #2e2e2e;
            color: #ddd;
            font-family: 'Segoe UI', sans-serif;
        }

        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.75);
            padding: 15px;
            pointer-events: auto;
            border-radius: 8px;
            border: 1px solid #444;
            z-index: 200;
        }

        button {
            pointer-events: auto;
            padding: 6px 12px;
            cursor: pointer;
            background: #555;
            color: white;
            border: none;
            border-radius: 4px;
        }

        button:hover {
            background: #777;
        }

        .active {
            background: #00aa00;
        }

        kbd {
            background: #333;
            padding: 2px 5px;
            border-radius: 3px;
            border: 1px solid #666;
            font-size: 0.85em;
        }

        .help {
            font-size: 0.85em;
            color: #bbb;
            margin: 4px 0;
        }

        #status-icon {
            float: right;
            font-size: 1.2em;
        }

        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            cursor: pointer;
            text-align: center;
        }

        #selected-info {
            margin-top: 10px;
            padding: 10px;
            background: rgba(50, 50, 100, 0.5);
            border: 1px solid #66f;
            border-radius: 4px;
            display: none;
        }

        #sel-name {
            font-weight: bold;
            color: #aaf;
        }

        #sel-pos {
            font-family: monospace;
        }

        /* Console UI */
        #console-panel {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 35%;
            background: rgba(0, 0, 0, 0.9);
            border-top: 2px solid #555;
            display: none;
            flex-direction: column;
            z-index: 300;
        }

        #console-output {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            font-family: 'Consolas', monospace;
            color: #00ff00;
            font-size: 14px;
            white-space: pre-wrap;
        }

        #console-input-bar {
            display: flex;
            border-top: 1px solid #333;
        }

        #console-input {
            flex: 1;
            background: #111;
            color: #fff;
            border: none;
            padding: 10px;
            font-family: 'Consolas', monospace;
            font-size: 14px;
            outline: none;
        }

        #console-send {
            background: #444;
            color: #fff;
            border: none;
            padding: 0 20px;
            cursor: pointer;
        }

        #console-send:hover {
            background: #666;
        }

        .log-ts {
            color: #888;
            margin-right: 10px;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "./three.module.js",
                "three/addons/controls/OrbitControls.js": "./OrbitControls.js"
            }
        }
    </script>
</head>

<body>
    <div id="overlay">
        <div>
            <h2>Click to Capture</h2>
            <p>WEB画面クリックで操作開始<br>Altで解除<br>クリックでブロック選択</p>
        </div>
    </div>

    <div id="info">
        <h3 style="margin-top:0">Viewer v23 <span id="status-icon">⚡</span></h3>
        <p>Instances: <span id="count">0</span> | Players: <span id="pcount">0</span></p>
        <p><button id="btnFollow" class="active">Auto Follow: POS ONLY</button></p>
        <p><button id="btnFocusMap">Focus Map Center</button></p>
        <p><button id="btnConsole" style="background:#4400aa;">💻 TERMINAL (CMD)</button></p>

        <div id="selected-info">
            <div>Selected: <span id="sel-name">-</span></div>
            <div id="sel-pos">-</div>
        </div>

        <hr style="border-color:#555">
        <p class="help">⌨️ <kbd>Alt</kbd> : Release</p>
        <p class="help">⌨️ <kbd>W/A/S/D</kbd> : Fly</p>
        <p class="help">🖱️ <kbd>L-Click</kbd> : Select</p>
        <p class="help" id="eco-msg" style="color:#888; display:none;">💤 ECO MODE (1fps)</p>
    </div>

    <div id="console-panel">
        <div id="console-output">
            <div>AI Server Console v1.0 connected...</div>
        </div>
        <div id="console-input-bar">
            <input type="text" id="console-input" placeholder="Type /command or say something...">
            <button id="console-send">SEND</button>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- Config ---
        const MAX_INSTANCES = 250000;
        const COLORS = [
            0xffffff, 0xffa500, 0xff00ff, 0xadd8e6, 0xffff00, 0x00ff00, 0xffc0cb, 0x808080,
            0xd3d3d3, 0x00ffff, 0x800080, 0x0000ff, 0x964b00, 0x008000, 0xff0000, 0x000000
        ];

        // FPS Limiter Config
        const FPS_LIMIT = 120;
        const FRAME_MS = 1000 / FPS_LIMIT;
        let lastFrameTime = 0;

        let scene, camera, renderer, mesh, controls, playerGroup;
        let selectionBox;
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let voxelMap = [];

        const keyState = {};
        let isLocked = false;
        let isAutoFollow = true;
        let targetPlayerPos = null;
        let prevTargetPos = null;
        let mapCenter = new THREE.Vector3(0, 0, 0);
        let hasCentered = false;
        let localMapVersion = -1;
        let yaw = 0, pitch = 0;

        // Eco Mode
        let lastActionTime = Date.now();
        let lastRenderTime = 0;
        const IDLE_THRESHOLD = 3000; // 3 sec to Sleep

        const overlay = document.getElementById('overlay');
        const btnFollow = document.getElementById('btnFollow');
        const btnFocusMap = document.getElementById('btnFocusMap');
        const btnConsole = document.getElementById('btnConsole');
        const selInfo = document.getElementById('selected-info');
        const selName = document.getElementById('sel-name');
        const selPos = document.getElementById('sel-pos');
        const statusIcon = document.getElementById('status-icon');
        const ecoMsg = document.getElementById('eco-msg');

        // Console UI
        const consolePanel = document.getElementById('console-panel');
        const consoleOut = document.getElementById('console-output');
        const consoleIn = document.getElementById('console-input');
        const consoleSend = document.getElementById('console-send');
        let isConsoleOpen = false;
        let logCursor = -1;

        function wakeUp() { lastActionTime = Date.now(); }

        init();

        // Sequential Polling
        const playerParams = new URL(document.location).searchParams;
        // Faster Update Rate: 100ms
        const REFRESH_RATE = 100;

        async function mapLoop() {
            await fetchMap();
            setTimeout(mapLoop, REFRESH_RATE);
        }
        async function logLoop() {
            await fetchLogs();
            setTimeout(logLoop, 1000);
        }
        mapLoop();
        logLoop();


        // --- Events (Wake Up) ---
        window.addEventListener('mousemove', (e) => {
            wakeUp();
            if (isLocked) {
                yaw -= e.movementX * 0.002;
                pitch -= e.movementY * 0.002;
                pitch = Math.max(-1.5, Math.min(1.5, pitch));
                updateCameraRotation();
            }
        });
        window.addEventListener('keydown', (e) => { wakeUp(); processKey(e, true); });
        window.addEventListener('keyup', (e) => { wakeUp(); processKey(e, false); });
        window.addEventListener('mousedown', (e) => { wakeUp(); processClick(e); });
        window.addEventListener('wheel', wakeUp);

        btnFollow.addEventListener('click', (e) => {
            wakeUp();
            isAutoFollow = !isAutoFollow;
            btnFollow.innerText = isAutoFollow ? "Auto Follow: POS ONLY" : "Auto Follow: OFF";
            btnFollow.className = isAutoFollow ? "active" : "";
            e.stopPropagation();
        });
        btnFocusMap.addEventListener('click', (e) => {
            wakeUp();
            if (mapCenter) {
                camera.position.set(mapCenter.x, mapCenter.y + 50, mapCenter.z + 50);
                controls.target.copy(mapCenter);
                controls.update();
                camera.lookAt(mapCenter);
            }
            e.stopPropagation();
        });

        btnConsole.addEventListener('click', (e) => {
            wakeUp();
            isConsoleOpen = !isConsoleOpen;
            consolePanel.style.display = isConsoleOpen ? 'flex' : 'none';
            if (isConsoleOpen) consoleIn.focus();
            e.stopPropagation();
        });

        // Console Send
        async function sendCommand() {
            wakeUp();
            const txt = consoleIn.value.trim();
            if (!txt) return;
            consoleIn.value = "";
            try {
                await fetch('/v1/mc/command_request', {
                    method: 'POST', body: JSON.stringify({ type: "console", player: "WebUser", target: txt }),
                    headers: { 'Content-Type': 'application/json' }
                });
                const div = document.createElement('div');
                div.innerText = "> " + txt; div.style.color = "#aaa";
                consoleOut.appendChild(div); consoleOut.scrollTop = consoleOut.scrollHeight;
            } catch (e) { console.error(e); }
        }
        consoleSend.addEventListener('click', sendCommand);
        consoleIn.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendCommand(); e.stopPropagation(); });

        overlay.addEventListener('click', () => {
            overlay.style.display = 'none'; // Force hide immediately
            document.body.requestPointerLock();
        });

        document.addEventListener('pointerlockchange', () => {
            isLocked = (document.pointerLockElement === document.body);
            if (!isLocked) overlay.style.display = 'flex';
            controls.enabled = !isLocked;
            if (!isLocked) {
                const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
                controls.target.copy(camera.position).add(forward.multiplyScalar(10));
                controls.update();
            }
            wakeUp();
        });

        document.addEventListener('pointerlockerror', () => {
            console.error("Pointer lock failed.");
            overlay.style.display = 'flex';
        });

        function processKey(e, isDown) {
            if (document.activeElement === consoleIn) return;
            keyState[e.code] = isDown;
            if (isDown && e.key === 'Alt') { document.exitPointerLock(); e.preventDefault(); }
            wakeUp();
        }

        function processClick(e) {
            if (e.button !== 0) return;
            if (isConsoleOpen && (e.target.closest('#console-panel') || e.target === btnConsole)) return;
            if (isLocked) raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            else {
                mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
                raycaster.setFromCamera(mouse, camera);
            }
            const intersects = raycaster.intersectObject(mesh);
            if (intersects.length > 0) {
                const instanceId = intersects[0].instanceId;
                if (instanceId !== undefined && voxelMap[instanceId]) selectBlock(instanceId);
            }
        }

        function selectBlock(id) {
            const data = voxelMap[id];
            if (!data) return;
            const matrix = new THREE.Matrix4(); mesh.getMatrixAt(id, matrix);
            const pos = new THREE.Vector3(), q = new THREE.Quaternion(), s = new THREE.Vector3();
            matrix.decompose(pos, q, s);
            selectionBox.position.copy(pos); selectionBox.quaternion.copy(q); selectionBox.scale.copy(s).multiplyScalar(1.05);
            selectionBox.visible = true;
            selInfo.style.display = 'block';
            selPos.innerText = `${data.x}, ${data.y}, ${data.z}`;

            let name = "Unknown"; const t = data.type;
            if (t === 1) name = "Stone/Solid"; else if (t === 2) name = "Glass/Pane"; else if (t === 3) name = "Slab";
            else if (t === 20) name = "Repeater CMD"; else if (t === 21) name = "Chain CMD"; else if (t === 22) name = "Impluse CMD";
            else if (t >= 100) name = "Colored";
            selName.innerText = name + ` (ID:${t})`;
            wakeUp();
        }

        function init() {
            scene = new THREE.Scene(); scene.background = new THREE.Color(0x282828);
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 8000);
            camera.up.set(0, 1, 0); camera.position.set(0, 50, 50);
            scene.add(new THREE.AmbientLight(0xffffff, 0.7));
            const sun = new THREE.DirectionalLight(0xffffff, 1.2); sun.position.set(200, 400, 200); scene.add(sun);
            renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);
            controls = new OrbitControls(camera, renderer.domElement); controls.enableDamping = true;
            controls.mouseButtons = { MIDDLE: THREE.MOUSE.ROTATE, RIGHT: THREE.MOUSE.PAN };

            // Wake Up on Orbit
            controls.addEventListener('change', wakeUp);

            scene.add(new THREE.GridHelper(500, 50, 0x444444, 0x333333));
            scene.add(new THREE.AxesHelper(10));
            playerGroup = new THREE.Group(); scene.add(playerGroup);
            const boxGeo = new THREE.BoxGeometry(1, 1, 1);
            const boxMat = new THREE.MeshBasicMaterial({ color: 0xffff00, wireframe: true, depthTest: false, transparent: true });
            selectionBox = new THREE.Mesh(boxGeo, boxMat); selectionBox.visible = false; scene.add(selectionBox);
            initMesh();
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
                wakeUp();
            });
            updateCameraRotation();
        }

        // Player Visuals: Minecraft Skin (Box)
        const playerGeo = new THREE.BoxGeometry(0.6, 1.8, 0.6); // 1.8m tall, 0.6m wide
        const playerMat = new THREE.MeshStandardMaterial({ color: 0x00ffff, rough: 0.8 }); // Cyan default
        const playerMeshes = {}; // Store player meshes by name

        function initMesh() {
            if (mesh) { scene.remove(mesh); mesh.dispose(); }
            const geometry = new THREE.BoxGeometry(0.98, 0.98, 0.98);
            const material = new THREE.MeshStandardMaterial({ roughness: 0.8, metalness: 0.1 });
            mesh = new THREE.InstancedMesh(geometry, material, MAX_INSTANCES);
            mesh.count = 0; mesh.frustumCulled = false; scene.add(mesh);
        }
        function updateCameraRotation() { const q1 = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), yaw); const q2 = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), pitch); camera.quaternion.copy(q1).multiply(q2); }

        function updateMovement() {
            if (isAutoFollow && targetPlayerPos && !isLocked) {
                if (prevTargetPos) {
                    const dx = targetPlayerPos.x - prevTargetPos.x;
                    const dy = targetPlayerPos.y - prevTargetPos.y;
                    const dz = targetPlayerPos.z - prevTargetPos.z;
                    if (Math.abs(dx) > 0.01 || Math.abs(dy) > 0.01 || Math.abs(dz) > 0.01) wakeUp();
                    camera.position.x += dx; camera.position.y += dy; camera.position.z += dz;
                    controls.target.x += dx; controls.target.y += dy; controls.target.z += dz;
                }
                prevTargetPos = { ...targetPlayerPos };
            } else { if (targetPlayerPos) prevTargetPos = { ...targetPlayerPos }; }

            if (!isLocked) controls.update();
            if (isLocked) {
                const spd = (keyState['ShiftLeft'] || keyState['ShiftRight']) ? 1.5 : 0.13;
                const f = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
                const r = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
                const u = new THREE.Vector3(0, 1, 0);
                let moved = false;
                if (keyState['KeyW']) { camera.position.addScaledVector(f, spd); moved = true; }
                if (keyState['KeyS']) { camera.position.addScaledVector(f, -spd); moved = true; }
                if (keyState['KeyA']) { camera.position.addScaledVector(r, -spd); moved = true; }
                if (keyState['KeyD']) { camera.position.addScaledVector(r, spd); moved = true; }
                if (keyState['Space']) { camera.position.addScaledVector(u, spd); moved = true; }
                if (keyState['ControlLeft']) { camera.position.addScaledVector(u, -spd); moved = true; }
                if (moved) {
                    wakeUp();
                    if (isAutoFollow && targetPlayerPos) prevTargetPos = { ...targetPlayerPos };
                }
            }
        }

        const TARGET_MS = 1000 / 60;
        function loop() {
            const now = performance.now();
            const delta = now - lastFrameTime;
            if (delta >= TARGET_MS) {
                lastFrameTime = now - (delta % TARGET_MS);
                updateMovement();
                renderer.render(scene, camera);
                statusIcon.innerText = "⚡";
                ecoMsg.style.display = 'none';
            }
            if (!document.hidden) requestAnimationFrame(loop);
        }

        // Single starter
        lastFrameTime = performance.now();
        loop();

        // Background recovery
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) loop();
        });
        setInterval(() => {
            if (document.hidden) loop();
        }, 100);


        async function fetchMap() {
            try {
                const res = await fetch(`/v1/mc/map?since=${localMapVersion}`);
                const data = await res.json();
                if (data.players) {
                    const oldP = JSON.stringify(playerGroup.userData); // quick check? nah
                    updatePlayers(data.players);
                }
                if (data.changed && data.map) {
                    updateVoxels(data.map);
                    localMapVersion = data.version;
                    wakeUp(); // Map changed -> Wake up to show it!
                }
            } catch (e) { }
        }
        async function fetchLogs() {
            if (!isConsoleOpen) return;
            try {
                const res = await fetch(`/v1/system/logs?since=${logCursor}`);
                const data = await res.json();
                if (data.logs && data.logs.length > 0) {
                    for (const l of data.logs) {
                        const div = document.createElement('div');
                        const ts = document.createElement('span'); ts.className = "log-ts"; ts.innerText = `[${l.ts}]`;
                        div.appendChild(ts); div.appendChild(document.createTextNode(l.msg));
                        consoleOut.appendChild(div);
                    }
                    consoleOut.scrollTop = consoleOut.scrollHeight;
                    logCursor = data.cursor;
                    wakeUp();
                } else if (data.cursor > logCursor) { logCursor = data.cursor; }
            } catch (e) { }
        }


        function updatePlayers(pDict) {
            // ... same logic ..
            while (playerGroup.children.length > 0) playerGroup.remove(playerGroup.children[0]);
            const names = Object.keys(pDict); document.getElementById('pcount').innerText = names.length;
            const mat = new THREE.MeshBasicMaterial({ color: 0x00ffff }); const geo = new THREE.SphereGeometry(0.4, 8, 8);
            if (names.length > 0 && isAutoFollow) { if (!targetPlayerPos) targetPlayerPos = pDict[names[0]].pos; targetPlayerPos = pDict[names[0]].pos; }
            for (const n of names) { const p = pDict[n]; const m = new THREE.Mesh(geo, mat); m.position.set(p.pos.x, p.pos.y + 1.62, p.pos.z); playerGroup.add(m); }
        }

        const _dummy = new THREE.Object3D(); const _color = new THREE.Color();
        function updateVoxels(mapData) {
            // ... same logic ...
            const keys = Object.keys(mapData); let idx = 0; voxelMap = [];
            let minX = Infinity, maxX = -Infinity; let minY = Infinity, maxY = -Infinity; let minZ = Infinity, maxZ = -Infinity;
            function getType(x, y, z) { return mapData[`${x},${y},${z}`] || 0; }
            function connects(t) { return t !== 0; }
            for (const key of keys) {
                if (idx >= MAX_INSTANCES - 5) break;
                const [mcX, mcY, mcZ] = key.split(',').map(Number); const type = mapData[key];
                if (mcX < minX) minX = mcX; if (mcX > maxX) maxX = mcX; if (mcY < minY) minY = mcY; if (mcY > maxY) maxY = mcY; if (mcZ < minZ) minZ = mcZ; if (mcZ > maxZ) maxZ = mcZ;
                let px = mcX + 0.5; let py = mcY + 0.5; let pz = mcZ + 0.5; let col = 0xffaa00;
                if (type === 1) col = 0xaaaaaa; else if (type === 2) col = 0xaaccff; else if (type === 3) col = 0xccaa88; else if (type === 140) col = 0xaaccff;
                else if (type >= 100 && type <= 115) col = COLORS[type - 100]; else if (type >= 120 && type <= 135) col = COLORS[type - 120]; else if (type >= 200 && type <= 215) col = COLORS[type - 200];
                else if (type === 20) col = 0x800080; else if (type === 21) col = 0x00aa00; else if (type === 22) col = 0xff6600; else if (type === 23) col = 0xff0000;
                else if (type === 24) col = 0xffffaa; else if (type === 80) col = 0x8b4513; // Sign
                else if (type === 4 || type === 5) col = 0xd3d3d3; // Stairs/Slab (LightGray)

                // Nature
                else if (type === 8) col = 0x228b22; // Leaves (Green)
                else if (type === 9) col = 0x8b5a2b; // Log/Plank (Wood)
                else if (type === 10) col = 0x0000ff; // Water/Lava (Blue)

                // New Additions
                else if (type === 30) col = 0xe0f6ff; // Powder Snow
                else if (type === 31) col = 0xdeb887; // Ladder (Wood)
                else if (type === 32) col = 0x228b22; // Vine (Green)
                else if (type === 33) col = 0xffffff; // Snow System

                _color.setHex(col); _dummy.scale.set(1, 1, 1); _dummy.rotation.set(0, 0, 0); _dummy.position.set(px, py, pz);
                const isPane = (type === 2 || (type >= 100 && type <= 115)); const isFence = (type === 6); const isSign = (type === 80);
                const isWallPlate = (type === 31 || type === 32); // Ladder/Vine
                const isCarpet = (type === 7 || type === 33); // Carpet/Snow
                const isHalf = (type === 4 || type === 5); // Stairs/Slab

                if (isPane || isFence) {
                    const centerWidth = isFence ? 0.25 : 0.15; _dummy.scale.set(centerWidth, 1, centerWidth); _dummy.updateMatrix(); mesh.setMatrixAt(idx, _dummy.matrix); mesh.setColorAt(idx, _color); voxelMap[idx] = { x: mcX, y: mcY, z: mcZ, type: type }; idx++;
                    const w = isFence ? 0.15 : 0.05;
                    if (connects(getType(mcX, mcY, mcZ - 1))) { _dummy.position.set(px, py, pz - 0.25); _dummy.scale.set(w, 1, 0.5); _dummy.updateMatrix(); mesh.setMatrixAt(idx, _dummy.matrix); mesh.setColorAt(idx, _color); voxelMap[idx] = { x: mcX, y: mcY, z: mcZ, type: type }; idx++; }
                    if (connects(getType(mcX, mcY, mcZ + 1))) { _dummy.position.set(px, py, pz + 0.25); _dummy.scale.set(w, 1, 0.5); _dummy.updateMatrix(); mesh.setMatrixAt(idx, _dummy.matrix); mesh.setColorAt(idx, _color); voxelMap[idx] = { x: mcX, y: mcY, z: mcZ, type: type }; idx++; }
                    if (connects(getType(mcX - 1, mcY, mcZ))) { _dummy.position.set(px - 0.25, py, pz); _dummy.scale.set(0.5, 1, w); _dummy.updateMatrix(); mesh.setMatrixAt(idx, _dummy.matrix); mesh.setColorAt(idx, _color); voxelMap[idx] = { x: mcX, y: mcY, z: mcZ, type: type }; idx++; }
                    if (connects(getType(mcX + 1, mcY, mcZ))) { _dummy.position.set(px + 0.25, py, pz); _dummy.scale.set(0.5, 1, w); _dummy.updateMatrix(); mesh.setMatrixAt(idx, _dummy.matrix); mesh.setColorAt(idx, _color); voxelMap[idx] = { x: mcX, y: mcY, z: mcZ, type: type }; idx++; }
                } else if (isSign) {
                    // Simple Post for Sign
                    _dummy.scale.set(0.2, 0.5, 0.2); _dummy.position.y -= 0.25; // Short post
                    _dummy.updateMatrix(); mesh.setMatrixAt(idx, _dummy.matrix); mesh.setColorAt(idx, _color); voxelMap[idx] = { x: mcX, y: mcY, z: mcZ, type: type }; idx++;
                } else if (isWallPlate) {
                    // Render as flat plate in center
                    _dummy.scale.set(0.6, 1, 0.1);
                    _dummy.updateMatrix(); mesh.setMatrixAt(idx, _dummy.matrix); mesh.setColorAt(idx, _color); voxelMap[idx] = { x: mcX, y: mcY, z: mcZ, type: type }; idx++;
                } else if (isCarpet) {
                    _dummy.scale.set(1, 0.1, 1); _dummy.position.y -= 0.45;
                    _dummy.updateMatrix(); mesh.setMatrixAt(idx, _dummy.matrix); mesh.setColorAt(idx, _color); voxelMap[idx] = { x: mcX, y: mcY, z: mcZ, type: type }; idx++;
                } else if (isHalf) {
                    _dummy.scale.set(1, 0.5, 1); _dummy.position.y -= 0.25;
                    _dummy.updateMatrix(); mesh.setMatrixAt(idx, _dummy.matrix); mesh.setColorAt(idx, _color); voxelMap[idx] = { x: mcX, y: mcY, z: mcZ, type: type }; idx++;
                } else if (type === 3) { _dummy.scale.set(1, 0.5, 1); _dummy.position.y -= 0.25; _dummy.updateMatrix(); mesh.setMatrixAt(idx, _dummy.matrix); mesh.setColorAt(idx, _color); voxelMap[idx] = { x: mcX, y: mcY, z: mcZ, type: type }; idx++; }
                else { _dummy.updateMatrix(); mesh.setMatrixAt(idx, _dummy.matrix); mesh.setColorAt(idx, _color); voxelMap[idx] = { x: mcX, y: mcY, z: mcZ, type: type }; idx++; }
            }
            mesh.count = idx; mesh.instanceMatrix.needsUpdate = true; if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true; document.getElementById('count').innerText = idx;
            if (!hasCentered && idx > 0 && !targetPlayerPos) { mapCenter.set((minX + maxX) / 2, (minY + maxY) / 2, (minZ + maxZ) / 2); hasCentered = true; }
        }
